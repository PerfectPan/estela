name: Pages

# Manual only until the repository is public and Pages is enabled with "GitHub Actions" as the source. Then add a
# trigger (for example `push` to main with a `paths` filter on apps/site/** and docs/**).
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Project sites on GitHub Pages are served under /<repository>/.
      ESTELA_SITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.1
          cache: true
          require-lockfile: true
      # Builds the CLI the demo needs, prerenders the landing and docs pages, writes static search indexes, and
      # writes the demo report into dist/client/demo/.
      - name: Build the landing and docs site
        run: pnpm --filter '@rivus/estela-site...' run build
      - name: Check static site navigation
        env:
          CHROME: /usr/bin/google-chrome
        run: pnpm --filter @rivus/estela-site run check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist/client
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
