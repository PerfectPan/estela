name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, smoke-test, and inspect packages without uploading them
        type: boolean
        default: true

permissions: {}

env:
  npm_config_registry: https://registry.npmjs.org/

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2
      - name: Create or update the version pull request
        if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@v2.1.2
        with:
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          # CI starts when a maintainer marks the updated version PR ready for review.
          pr-draft: always

  publish:
    needs: version
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.dry-run == false) ||
      (github.event_name == 'push' && needs.version.outputs.mode == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:smoke
      - name: Publish packages and create tags and GitHub Releases
        uses: changesets/action/publish@v2.1.2

  dry-run:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:smoke
      - name: Inspect the publish plan and package archive
        run: |
          pnpm exec changeset publish-plan --output "$RUNNER_TEMP/publish-plan.json"
          pnpm --filter @rivus/agent-trace pack --out "$RUNNER_TEMP/agent-trace.tgz"
      - name: Save the dry-run evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            ${{ runner.temp }}/publish-plan.json
            ${{ runner.temp }}/agent-trace.tgz
          if-no-files-found: error
