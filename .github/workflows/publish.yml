# npm Trusted Publishing for @rivus/estela is registered against this file name; renaming it requires changing the
# package's trusted publisher on npmjs.com first. The release jobs come from the shared workflow in
# PerfectPan/gh-repo-checks; "Publishing to npm" in CONTRIBUTING.md describes how this repository uses it.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, smoke-test, and inspect packages without uploading them
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  release:
    # A manual dispatch runs the release only with dry-run unchecked.
    if: github.event_name == 'push' || !inputs.dry-run
    uses: PerfectPan/gh-repo-checks/.github/workflows/npm-release.yml@v1
    # The shared workflow narrows these per job; only its publish job can request an OIDC token.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      # Builds @rivus/estela and the packages it bundles with production conditions, packs and installs the CLI tarball,
      # runs the CLI smoke scenarios against the installed bin, and builds the dsh plugin bundles. The pack step then
      # packs those builds; the dsh smoke stays in CI on the version PR.
      check-command: pnpm -C apps/e2e run test:smoke && pnpm --filter '@rivus/dsh-estela...' run build
      # Both packages bundle the workspace packages they depend on and their own devDependencies, so the audit follows
      # both workspace graphs and keeps dev dependencies; the e2e suite and the root release tooling stay out. The scope
      # also takes in build tooling (Vite+, TypeScript), so a high advisory there blocks a release too: the trade for
      # not missing a bundled dependency. The dry-run job runs the same command.
      audit-command: pnpm --filter '@rivus/estela...' --filter '@rivus/dsh-estela...' audit --audit-level=high
      # The root package defines no version-packages script.
      version-command: pnpm exec changeset version

  dry-run:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.1
          require-lockfile: true
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:smoke
      - name: Build the dsh plugin, as the release does
        run: pnpm --filter '@rivus/dsh-estela...' run build
      - name: Audit dependencies, as the release does
        run: pnpm --filter '@rivus/estela...' --filter '@rivus/dsh-estela...' audit --audit-level=high
      - name: Inspect the publish plan and package archives
        run: |
          pnpm exec changeset publish-plan --output "$RUNNER_TEMP/publish-plan.json"
          pnpm --filter @rivus/estela pack --out "$RUNNER_TEMP/estela.tgz"
          pnpm --filter @rivus/dsh-estela pack --out "$RUNNER_TEMP/dsh-estela.tgz"
      - name: Save the dry-run evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            ${{ runner.temp }}/publish-plan.json
            ${{ runner.temp }}/estela.tgz
            ${{ runner.temp }}/dsh-estela.tgz
          if-no-files-found: error
