name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, smoke-test, and inspect the tarball without uploading it
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # The smoke setup preserves the exact installed tgz; publishing never packs the checkout again.
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        env:
          AGENT_TRACE_SMOKE_TARBALL: ${{ runner.temp }}/agent-trace.tgz
        run: pnpm run test:smoke
      - name: Publish the tested tarball
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(--access public --registry https://registry.npmjs.org/ --publish-wait-timeout 600000)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          pnpm publish "$RUNNER_TEMP/agent-trace.tgz" "${args[@]}"
      - name: Tag the published version and create its GitHub Release
        if: inputs.dry-run == false
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")"
          tag="v$version"
          awk -v heading="## $version" '
            $0 == heading { active = 1; next }
            active && /^## / { exit }
            active { print }
          ' apps/cli/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          git push origin "$GITHUB_SHA:refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
