name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, smoke-test, and inspect the tarball without uploading it
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Check the release version, notes, and tag
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$version" = "0.0.0" ]; then
            echo "::error::Set the release version and consume its changesets first."
            exit 1
          fi
          tag="v$version"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::$tag points to another commit."
              exit 1
            fi
          fi
          awk -v heading="## $version" '
            $0 == heading { found++; active = 1; next }
            active && /^## / { active = 0 }
            active { print; if (NF) nonempty = 1 }
            END { if (found != 1 || !nonempty) exit 1 }
          ' apps/cli/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          printf 'RELEASE_TAG=%s\nAGENT_TRACE_SMOKE_TARBALL=%s/agent-trace.tgz\n' "$tag" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # The smoke setup preserves the exact installed tgz; publishing never packs the checkout again.
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:smoke
      # The first release needs a token until the package exists and its trusted publisher is configured.
      - name: Configure the seeding token
        if: inputs.dry-run == false
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          fi
      - name: Publish the tested tarball
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(--access public --no-git-checks --registry https://registry.npmjs.org/ --publish-wait-timeout 600000)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          pnpm publish "$AGENT_TRACE_SMOKE_TARBALL" "${args[@]}"
      - name: Tag the published version and create its GitHub Release
        if: inputs.dry-run == false
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
