name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: ${{ github.event_name == 'pull_request' && 'test' || 'manual checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm from `packageManager` and a supported Node.js 26 release, restores the pnpm store cache
      # keyed on the lockfile, and runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.1
          cache: true
          require-lockfile: true
      - name: Repository checks
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: repository
      - name: Repository-specific checks
        run: |
          node scripts/check-doc-translations.mjs
          node scripts/check-conventions.mjs
          node scripts/check-layers.mjs
          node scripts/check-release-plan.mjs
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: pr-title
      - name: PR description
        # Bot PRs (dependency updates, release PRs) do not use the template; their titles are still checked.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: pr-body
      - run: pnpm lint
      # Both run the vite-plus from apps/cli's devDependencies, so they run after the install.
      - run: node scripts/format.mjs --check
      - run: node scripts/lint-scripts.mjs
      - run: node scripts/check-browser-bundle.mjs
      - name: Build Web once before CLI smoke tests
        run: pnpm --filter @rivus/estela-web run build
      - run: pnpm test
      - run: pnpm typecheck
      # Builds @rivus/estela with vp pack (and the packages it bundles), packs apps/cli, installs the tarball
      # into an empty temp dir, and runs the CLI smoke scenarios against the installed bin.
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:smoke
      - name: Install Chromium for Playwright
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
