name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Weekly canary against dsh's `latest` tag; only the `dsh-plugin` job runs on schedule.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: ${{ github.event_name == 'pull_request' && 'test' || 'manual checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Keeps HEAD^1 for the release intent check below.
          fetch-depth: 2
      # Installs the pnpm from `packageManager` and a supported Node.js 26 release, restores the pnpm store cache
      # keyed on the lockfile, and runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.1
          cache: true
          require-lockfile: true
      - name: Repository checks
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: repository
      - name: Repository-specific checks
        run: |
          node scripts/check-doc-translations.mjs
          node scripts/check-conventions.mjs
          node scripts/check-layers.mjs
      # Rejects a pending changeset that names a private package, which is never consumed, or that would move
      # @rivus/estela to 1.0.0 without `allow-major` in .github/repo-checks.conf.
      - name: Pending change records
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: release-plan
      # A pull request that changes docs/reference/public-interface.md must add release changeset(s) for the
      # affected package(s). HEAD is GitHub's merge commit, so HEAD^1 to HEAD is the pull request's change.
      - name: Release intent check tests
        run: node --test scripts/check-release-intent.test.mjs
      - name: Release intent of public interface changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-release-intent.mjs HEAD^1
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: pr-title
      - name: PR description
        # Bot PRs (dependency updates, release PRs) do not use the template; their titles are still checked.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: pr-body
      - run: pnpm lint
      # Both run the vite-plus from apps/cli's devDependencies, so they run after the install.
      - run: node scripts/format.mjs --check
      - run: node scripts/lint-scripts.mjs
      # Fails on any clone jscpd reports (lint-config's zero-threshold profile). The scan roots and ignores live in the
      # script in packages/schema/package.json.
      - run: pnpm --filter @rivus/estela-schema run duplicates
      # Knip with lint-config's shared policy, in the default and the production analysis; the entries,
      # project files, and ignores live in knip.ts.
      - run: pnpm --filter @rivus/estela-schema run knip
      - run: pnpm --filter @rivus/estela-schema run knip:production
      - run: node scripts/check-browser-bundle.mjs
      - name: Build Web once before CLI smoke tests
        run: pnpm --filter @rivus/estela-web run build
      - run: pnpm test
      - run: pnpm typecheck
      # Builds @rivus/estela with vp pack (and the packages it bundles), packs apps/cli, installs the tarball
      # into an empty temp dir, and runs the CLI smoke scenarios against the installed bin.
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:smoke
      # Builds the dsh plugin bundles (host and client) before measuring their sizes alongside the CLI.
      - name: Build the dsh plugin before budgets
        run: pnpm --filter '@rivus/dsh-estela...' run build
      # Reuses the production builds from the smoke and plugin build steps; generates its sessions into a temp
      # directory and writes the measured-vs-budget table to the job summary. Budgets and reasons: scripts/budgets/budgets.mjs.
      - name: Performance and size budgets
        timeout-minutes: 5
        run: node scripts/check-budgets.mjs
      # The smoke step above built the CLI; the site prerenders its pages, writes static search indexes, runs the
      # CLI for /demo/, and checks navigation under the project base path in headless Chrome.
      - name: Build and verify the docs site
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          pnpm --filter @rivus/estela-site run build
          pnpm --filter @rivus/estela-site run check
      - name: Install Chromium for Playwright
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14

  # The `test` job above is Linux on Node.js 26 with every check. This job runs the unit suites on macOS and Windows,
  # and the smoke suite on the installed tarball on all three systems with Node.js 24 (the oldest release the CLI's
  # `engines` allows) and 26. Budgets and the Playwright suite stay in `test`: their numbers are set on Linux runners.
  platforms:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: ${{ matrix.os }}, Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24', '26']
        exclude:
          - os: ubuntu-latest
            node: '26'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Node.js 24 runs only the installed CLI, through ESTELA_SMOKE_NODE. The workspace toolchain needs ^26.13.1,
      # which pnpm/setup installs next and puts ahead of this one on PATH.
      - if: matrix.node == '24'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.node == '24'
        shell: bash
        run: echo "ESTELA_SMOKE_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.1
          cache: true
          require-lockfile: true
      - name: Build Web once before the unit and smoke tests
        run: pnpm --filter @rivus/estela-web run build
      # The unit suites do not depend on the CLI's Node.js, so they run once per system. --no-bail and --no-sort
      # report every package, including the dependents of one that failed.
      - if: matrix.node == '26'
        run: pnpm -r --no-bail --no-sort test
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        run: pnpm run test:smoke

  # Packs @rivus/dsh-estela, installs it into a temporary DSH_HOME against pinned dsh on pull requests
  # (or dsh `latest` on the weekly schedule / manual dispatch), and drives `dsh web` with Chromium.
  dsh-plugin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'dsh-plugin (latest)' || 'dsh-plugin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.1
          cache: true
          require-lockfile: true
      - name: Build Web once before the dsh plugin smoke test
        run: pnpm --filter @rivus/estela-web run build
      - name: Install Chromium for Playwright
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium
      - name: dsh plugin smoke on the installed tarball
        env:
          ESTELA_DSH_VERSION: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'latest' || '' }}
        run: pnpm -C apps/dsh-plugin run test:smoke
