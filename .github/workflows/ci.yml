name: CI

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'test' || 'manual checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'
      - name: Repository checks
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: repository
      - name: Repository-specific checks
        run: |
          node scripts/check-doc-translations.mjs
          node scripts/check-conventions.mjs
          node scripts/check-layers.mjs
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: pr-title
      - name: PR description
        # Bot PRs (dependency updates, release PRs) do not use the template; their titles are still checked.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        uses: PerfectPan/gh-repo-checks@v1
        with:
          check: pr-body
      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: |
            common/temp/pnpm-store
            ~/.npm/_cacache
          key: ${{ runner.os }}-dependency-downloads-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml', 'common/config/rush/pnpm-config.json') }}
          restore-keys: ${{ runner.os }}-dependency-downloads-
      - run: node common/scripts/install-run-rush.js install
      - name: Release intent
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/$PR_BASE_REF" HEAD)"
          node common/scripts/install-run-rush.js change --verify --no-fetch --target-branch "$base"
          node scripts/release-intent.mjs check --base "$base"
      - run: node common/scripts/install-run-rush.js lint
      # oxfmt and oxlint come from apps/cli's devDependencies, so both run after the install.
      - run: node scripts/format.mjs --check
      - run: node scripts/lint-scripts.mjs
      - run: node scripts/check-browser-bundle.mjs
      - name: Build Web once before CLI smoke tests
        run: node common/scripts/install-run-rush.js build --only @rivus/agent-trace-web
      - run: node common/scripts/install-run-rush.js test
      - run: node common/scripts/install-run-rush.js typecheck
      # Builds @rivus/agent-trace with rslib (and the packages it bundles), packs apps/cli, installs the tarball
      # into an empty temp dir, and runs the CLI smoke scenarios against the installed bin.
      - name: CLI smoke on the installed tarball
        working-directory: apps/e2e
        run: node ../../common/scripts/install-run-rushx.js test:smoke
      - name: Install Chromium for Playwright
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end on the installed tarball
        working-directory: apps/e2e
        run: node ../../common/scripts/install-run-rushx.js test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
