name: Version Packages

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version-packages:
    # A manual dispatch on a feature branch would version that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The action pushes the version commit and opens the PR through the GitHub API,
          # so the checkout needs no persisted git credentials.
          persist-credentials: false
      # Before the package's first npm release, `pnpm version -r` consumes the changesets into a
      # changelog section for whatever version the manifest carries, without bumping anything
      # (0.0.0 → 0.0.0; after a manual bump, a second section for the same version). The first
      # release is manual; this workflow only runs once npm has a version to judge by.
      - name: Require a published version
        run: |
          if ! npm view @rivus/agent-trace versions --json --registry https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "::error::@rivus/agent-trace has no published version on npm yet. Finish the first release manually (set the version and publish; see CONTRIBUTING.md#release-intent) before running Version Packages."
            exit 1
          fi
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      # With pending changesets, runs the version script — `pnpm version -r`, which bumps
      # versions, writes the package CHANGELOG.md, and consumes the changesets — and opens
      # or updates the version PR. The separate manual Publish workflow releases the merged version.
      - name: Create version pull request
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ github.token }}
